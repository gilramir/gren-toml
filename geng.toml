[package]
name = "github.com/gilramir/gren-toml"
version = "1.1.0"
summary = "A TOML 1.1 parser that preserves comments and formatting"
license = "ISC"
geng = "0.6.0 <= v < 0.7.0"

[platform]
runtime = "any"

[modules]
exposed = [
    "Toml",
    "Toml.Ast",
    "Toml.Decode",
    "Toml.Edit",
    "Toml.Encode",
    "Toml.Literal",
    "Toml.Table",
]

[dependencies]
"github.com/gilramir/gren-bignum" = "1.0.0 <= v < 2.0.0"
"github.com/gilramir/gren-civil-time" = "1.0.0 <= v < 2.0.0"
